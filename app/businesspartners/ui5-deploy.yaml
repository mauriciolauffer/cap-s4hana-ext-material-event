# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "4.0"
metadata:
  name: com.sap.bp.businesspartners
type: application
builder:
  cachebuster:
    signatureType: hash
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-minifier
      afterTask: minify
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: stakeholdersmap
        additionalFiles:
          - xs-app.json
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
