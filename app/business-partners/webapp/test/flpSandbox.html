<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Business Partners - Fiori Launchpad Sandbox</title>
    
    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            bootstrapPlugins: {
                "RuntimeAuthoringPlugin": {
                    component: "sap.ushell.plugins.rta",
                    config: {
                        validateAppVersion: false
                    }
                },
                "PersonalizePlugin": {
                    component: "sap.ushell.plugins.rta-personalize",
                    config: {
                        validateAppVersion: false
                    }
                }
            },
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: "hidden"
                        }
                    }
                }
            },
            services: {
                LaunchPage: {
                    adapter: {
                        config: {
                            groups: [
                                {
                                    id: "businessPartnerGroup",
                                    title: "Business Partner Management",
                                    isPreset: true,
                                    isVisible: true,
                                    isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "businessPartners",
                                            title: "Business Partners",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                chipId: "catalogTile_1",
                                                title: "Business Partners",
                                                subtitle: "Manage Business Partners from S/4HANA",
                                                infoState: "Neutral",
                                                info: "",
                                                icon: "sap-icon://customer",
                                                targetURL: "#BusinessPartners-display"
                                            }
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                },
                ClientSideTargetResolution: {
                    adapter: {
                        config: {
                            inbounds: {
                                "BusinessPartners-display": {
                                    semanticObject: "BusinessPartners",
                                    action: "display",
                                    description: "Display Business Partners",
                                    title: "Business Partners",
                                    signature: {
                                        parameters: {},
                                        additionalParameters: "allowed"
                                    },
                                    resolutionResult: {
                                        applicationType: "SAPUI5",
                                        additionalInformation: "SAPUI5.Component=cap.s4hana.ext.businesspartners",
                                        url: sap.ui.require.toUrl("cap/s4hana/ext/businesspartners")
                                    }
                                }
                            }
                        }
                    }
                }
            }
        };
    </script>

    <script src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.ushell,sap.collaboration,sap.ui.core"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-language="en"
        data-sap-ui-resourceroots='{"cap.s4hana.ext.businesspartners": "./"}'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function() {
            sap.ushell.Container.createRenderer().placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
