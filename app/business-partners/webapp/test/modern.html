<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Business Partners - Modern UI5</title>
    
    <script id="sap-ui-bootstrap" 
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.fe.templates"
        data-sap-ui-async="true"
        data-sap-ui-preload="async" 
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-language="en"
        data-sap-ui-resourceroots='{"cap.s4hana.ext.businesspartners": "./"}'>
    </script>
    
    <script>
        sap.ui.getCore().attachInit(async function() {
            // Import required modules
            const [Component, ComponentContainer, Shell] = await new Promise((resolve) => {
                sap.ui.require([
                    "sap/ui/core/Component",
                    "sap/ui/core/ComponentContainer", 
                    "sap/m/Shell"
                ], (...modules) => resolve(modules));
            });
            
            try {
                // Create component using modern API
                const oComponent = await Component.create({
                    name: "cap.s4hana.ext.businesspartners"
                });
                
                // Create shell and container
                const oShell = new Shell({
                    app: new ComponentContainer({
                        component: oComponent,
                        height: "100%",
                        width: "100%"
                    })
                });
                
                // Place the shell
                oShell.placeAt("content");
                
                console.log("✅ Business Partners app loaded successfully with modern UI5 API!");
                
            } catch (error) {
                console.error("❌ Error loading Business Partners app:", error);
                
                // Fallback content
                document.getElementById("content").innerHTML = `
                    <div style="padding: 2rem; text-align: center; color: #d32f2f;">
                        <h2>⚠️ Application Loading Error</h2>
                        <p>The Fiori Elements application failed to load. This might be due to:</p>
                        <ul style="text-align: left; max-width: 500px; margin: 0 auto;">
                            <li>Service not available</li>
                            <li>Component loading issues</li>
                            <li>Metadata loading problems</li>
                        </ul>
                        <p><strong>Alternative:</strong> Try the <a href="simple.html">Simple Table View</a> or <a href="dashboard.html">Dashboard</a></p>
                        <p><strong>Error Details:</strong> ${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
    
    <style>
        html, body, #content {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #0070f2;
        }
    </style>
</head>
<body class="sapUiBody">
    <div id="content" class="loading">
        🔄 Loading Business Partners Application...
    </div>
</body>
</html>
