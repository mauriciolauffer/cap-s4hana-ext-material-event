<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Business Partners - Debug Version</title>
    
    <!-- Enable debug logging -->
    <script>
        window["sap-ui-config"] = {
            "debug": true,
            "inspect": true,
            "logLevel": "INFO"
        };
    </script>
    
    <script id="sap-ui-bootstrap" 
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.fe.templates,sap.suite.ui.commons"
        data-sap-ui-async="true"
        data-sap-ui-preload="async" 
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-language="en"
        data-sap-ui-debug="true"
        data-sap-ui-resourceroots='{"cap.s4hana.ext.businesspartners": "./"}'>
    </script>
    
    <script>
        // Enhanced error handling
        window.addEventListener('error', function(e) {
            console.error('Global Error:', e.error);
            document.getElementById('error-details').innerHTML += 
                '<div style="color: red; margin: 5px 0;">❌ ' + e.message + '</div>';
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled Promise Rejection:', e.reason);
            document.getElementById('error-details').innerHTML += 
                '<div style="color: orange; margin: 5px 0;">⚠️ Promise Rejection: ' + e.reason + '</div>';
        });
        
        sap.ui.getCore().attachInit(async function() {
            console.log("🚀 Starting Business Partners app with debug logging...");
            
            try {
                // Test service availability first
                const response = await fetch('/business-partners/$metadata');
                if (!response.ok) {
                    throw new Error('Service not available: ' + response.status);
                }
                console.log("✅ Service metadata available");
                
                // Load modules with detailed logging
                console.log("📦 Loading UI5 modules...");
                const [Component, ComponentContainer, Shell] = await new Promise((resolve, reject) => {
                    sap.ui.require([
                        "sap/ui/core/Component",
                        "sap/ui/core/ComponentContainer", 
                        "sap/m/Shell"
                    ], (...modules) => {
                        console.log("✅ UI5 modules loaded successfully");
                        resolve(modules);
                    }, (error) => {
                        console.error("❌ Failed to load UI5 modules:", error);
                        reject(error);
                    });
                });
                
                // Create component with detailed logging
                console.log("🔨 Creating component...");
                const oComponent = await Component.create({
                    name: "cap.s4hana.ext.businesspartners",
                    manifest: true
                });
                console.log("✅ Component created successfully:", oComponent.getId());
                
                // Create shell and container
                console.log("🏗️ Creating UI shell...");
                const oShell = new Shell({
                    app: new ComponentContainer({
                        component: oComponent,
                        height: "100%",
                        width: "100%"
                    })
                });
                
                // Place the shell
                oShell.placeAt("content");
                console.log("✅ Application rendered successfully!");
                
                // Hide loading indicator
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error("❌ Application loading failed:", error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #d32f2f; text-align: center; padding: 2rem;">
                        <h2>⚠️ Application Loading Failed</h2>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <div style="margin-top: 20px;">
                            <a href="/business-partners-simple" style="color: #0070f2;">Try Simple View</a> | 
                            <a href="/business-partners-dashboard" style="color: #0070f2;">Try Dashboard</a>
                        </div>
                    </div>
                `;
                
                // Show detailed error info
                document.getElementById('error-details').innerHTML += 
                    '<div style="color: red; margin: 10px 0; padding: 10px; background: #ffebee; border-radius: 4px;">'+
                    '<strong>Main Error:</strong> ' + error.message + '<br>' +
                    '<strong>Stack:</strong> ' + (error.stack || 'No stack trace') +
                    '</div>';
            }
        });
    </script>
    
    <style>
        html, body, #content {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
        }
        
        #loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #0070f2;
        }
        
        #error-details {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9rem;
            z-index: 1000;
        }
    </style>
</head>
<body class="sapUiBody">
    <div id="content">
        <div id="loading">
            <div style="font-size: 2rem; margin-bottom: 1rem;">🔄</div>
            <div>Loading Business Partners Application...</div>
            <div style="font-size: 0.9rem; margin-top: 1rem; opacity: 0.7;">
                Debug mode enabled - Check browser console for details
            </div>
        </div>
    </div>
    <div id="error-details"></div>
</body>
</html>
